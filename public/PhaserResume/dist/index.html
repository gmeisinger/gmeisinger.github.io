<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Prevent default body margin from adding extra height when the game/canvas
       is sized to the viewport. Also make the game container and canvas fill
       the viewport and avoid inline-block whitespace creating scroll. */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* Ensure the game container and any created canvas take the full size */
    #game,
    #game>canvas,
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <script type="text/javascript" src="bundle.min.js"></script>
</body>

</html>

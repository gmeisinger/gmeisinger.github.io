<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | PsychedelicJam</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    /* Make the Unity player responsive so it can scale inside an iframe/container.
         The container uses an aspect-ratio box (960x600 -> 62.5% height) so the
         canvas can use 100% width/height. */
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }

    /* Make the main container a responsive aspect box. TemplateData/style.css
         defines #unity-container.unity-desktop as absolute/centered; override
         that behavior so the player can scale inside an iframe or page layout. */
    #unity-container {
      width: 100%;
      max-width: 100%;
      /* 600/960 = 0.625 -> 62.5% */
      position: relative !important;
      padding-bottom: 62.5% !important;
      height: 0 !important;
      margin: 0 auto !important;
    }

    /* Override the desktop centering rule from TemplateData/style.css */
    #unity-container.unity-desktop {
      left: auto !important;
      top: auto !important;
      transform: none !important;
      position: relative !important;
      padding-bottom: 62.5% !important;
    }

    #unity-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* keep other UI elements positioned over the canvas */
    #unity-loading-bar,
    #unity-footer,
    #unity-mobile-warning {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 2;
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=960 height=600></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-mobile-warning">
      WebGL builds are not supported on mobile devices.
    </div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">PsychedelicJam</div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/PsychedelicBuild.loader.js";
    var config = {
      dataUrl: buildUrl + "/PsychedelicBuild.data",
      frameworkUrl: buildUrl + "/PsychedelicBuild.framework.js",
      codeUrl: buildUrl + "/PsychedelicBuild.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "PsychedelicJam",
      productVersion: "1.0",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var mobileWarning = document.querySelector("#unity-mobile-warning");

    // By default Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      // Avoid draining fillrate performance on mobile devices,
      // and default/override low DPI mode on mobile browsers.
      config.devicePixelRatio = 1;
      mobileWarning.style.display = "block";
      setTimeout(() => {
        mobileWarning.style.display = "none";
      }, 5000);
    } else {
      // Make the canvas fill the responsive container so the iframe/embed can scale it
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }
    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
        fullscreenButton.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
